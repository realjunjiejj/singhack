[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jb-clarity-engine"
version = "1.0.0"
description = "JB Clarity deterministic wealth intelligence engine"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "pydantic>=2.5",
    "jsonschema>=4.20",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
jb-clarity = "jb_clarity.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jb_clarity = ["config/*.json", "language/fixtures/*.json"]
