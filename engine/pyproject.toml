[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jb-clarity-engine"
version = "1.0.0"
description = "JB Clarity deterministic wealth intelligence engine"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "pydantic>=2.5",
    "jsonschema>=4.20",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1",
    "xlrd>=2.0",
]
dev = ["pytest>=7.4", "httpx>=0.27", "openpyxl>=3.1"]

[project.scripts]
jb-clarity = "jb_clarity.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jb_clarity = ["config/*.json", "language/fixtures/*.json"]
